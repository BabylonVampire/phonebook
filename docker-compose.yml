# Подъём всего приложения: docker compose up -d --build  →  http://localhost:3000
# Учётные данные БД берутся из файла .env рядом с этим файлом (см. .env.example),
# а если его нет — используются значения по умолчанию для локальной разработки.
services:
  db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phonebook}
      POSTGRES_USER: ${POSTGRES_USER:-phonebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonebook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 снаружи, чтобы не конфликтовать с PostgreSQL, установленным на компьютере
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-phonebook}
      PGUSER: ${POSTGRES_USER:-phonebook}
      PGPASSWORD: ${POSTGRES_PASSWORD:-phonebook}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
